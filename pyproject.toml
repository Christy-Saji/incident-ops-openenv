[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-openenv"
version = "2.0.0"
description = "RL benchmark for SRE incident triage — SFT → GRPO training of a language model across 6 production incident scenarios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "openai",
    "pydantic",
    "pyyaml",
    "uvicorn",
]

[project.optional-dependencies]
train = [
    "unsloth",
    # trl<=0.24.0 is unsloth_zoo's own upper bound (it pins the pair together).
    # transformers is capped below 5.0: trl 0.24.0's availability checks
    # (is_mergekit_available/is_llm_blender_available) assume transformers'
    # internal _is_package_available() returns a bare bool, which changed to
    # always-truthy tuple in transformers 5.x -- trl then unconditionally tries
    # to import optional extras (mergekit, the abandoned llm-blender) that
    # aren't installed / don't work, crashing `from trl import GRPOTrainer`.
    # unsloth_zoo's own metadata claims transformers<=5.5.0 is fine here; it
    # isn't -- verified by hand. Revisit this pin only after confirming a newer
    # trl/transformers pair imports cleanly AND unsloth's patches still apply.
    "trl>=0.18.2,<=0.24.0",
    "transformers>=4.45,<5.0",
    # unsloth_zoo also pins datasets away from 4.0.x/4.1.0/>=4.4 -- match it so a
    # fresh install doesn't silently drift onto a version it declares unsupported.
    "datasets>=3.4.1,!=4.0.*,!=4.1.0,<4.4.0",
    "torch",
    # unsloth_zoo's models/_utils.py unconditionally imports unsloth_zoo.vision_utils
    # (multimodal support code) even for a text-only model load -- it doesn't declare
    # torchvision as a dependency itself, so it must be installed explicitly here.
    "torchvision",
    "pandas",
    "matplotlib",
    "numpy",
]
# AMD Developer Cloud / ROCm (MI300X) provision — hardware.backend: transformers.
# No unsloth and no bitsandbytes (both CUDA-oriented); torch is intentionally omitted
# because the ROCm build ships in the rocm/pytorch-training container / AMD wheel
# index, not on PyPI — installing plain `torch` here would pull the CUDA build.
# Same trl/transformers cap as `train` above -- this backend still imports
# trl.GRPOTrainer via training/pipeline.py, so it hits the identical bug.
train-amd = [
    "trl>=0.18.2,<=0.24.0",
    "transformers>=4.45,<5.0",
    "peft",
    "accelerate",
    "datasets",
    "pandas",
    "matplotlib",
    "numpy",
]
eval = [
    "scipy",
    "pandas",
    "matplotlib",
    "numpy",
]
dev = [
    "pytest",
    "ruff",
    # CPU-only, no torch: training/dataset.py's generate_sft_dataset() /
    # generate_grpo_dataset() need it to build a HuggingFace Dataset, and
    # tests/test_dataset.py exercises both in CI.
    "datasets",
]

[project.scripts]
server   = "server.app:main"
train    = "train:main"
evaluate = "scripts.evaluate:main"

[tool.setuptools]
packages = ["env", "graders", "tasks", "server", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
# Notebooks legitimately interleave imports with code; linting them as modules
# produces only E402/E701 noise.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

