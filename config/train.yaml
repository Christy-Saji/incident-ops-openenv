# Incident Ops OpenEnv — Training Configuration
# Edit this file to change training behaviour.
# All values can also be overridden via environment variables (see training/config.py).
#
# The file is split into two halves:
#
#   LOCKED  — algorithm knobs (model + training). Settled; not re-opened when the
#             hardware/backend decision is made.
#   HARDWARE PROFILE — deferred. Where training runs, which backend loads the model
#             (Unsloth vs stock transformers+peft), and 4-bit vs bf16 are ONE coupled
#             decision made later. When it lands it edits ONLY the `hardware:` block
#             below and training/backend.py — nothing else.

experiment_name: "grpo_run_v1"
seed: 42

# ===========================================================================
# LOCKED — algorithm knobs (do not retune when choosing hardware)
# ===========================================================================

model:
  # Base model + LoRA geometry. Model choice is settled: Qwen2.5-3B-Instruct.
  # (4-bit vs bf16 loading is a hardware-profile concern — see `hardware:` below.)
  id: "unsloth/Qwen2.5-3B-Instruct"
  lora_rank: 32
  # alpha = 2*rank is the convention. This was 16 against rank 32,
  # giving alpha/r = 0.5 scaling — a quarter of the intended LoRA update.
  lora_alpha: 64
  # LoRA adapters on attention (q,k,v,o) + MLP (gate,up,down) projections.
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

  # Set push_to_hub: true and HF_TOKEN in Colab secrets to auto-upload after training
  push_to_hub: false
  hub_model_id: "chritsysajii/sre-agent-qwen25-3b-grpo"  # change to your HF username

training:
  # GRPO
  grpo_max_steps: 500
  # Tier 1 Phase C: memory_leak/disk_full held out of SFT + GRPO entirely,
  # so scripts/evaluate.py's held-out eval on them is meaningful.
  train_tasks: ["easy", "medium", "hard", "network"]
  eval_tasks: ["memory_leak", "disk_full"]
  # eps-greedy walk (training/dataset.py::iter_eps_greedy_states): with
  # probability epsilon, take a random action instead of the Q*-optimal one,
  # so GRPO sees states beyond the ones SFT already memorised.
  epsilon: 0.3
  n_states: 1000

  # Prompt budget. Prompts are ~700 tokens median / ~900 max. At 512 TRL
  # LEFT-truncated them, silently deleting the system prompt and the head of the
  # observation JSON for the entire first training run. pipeline.py now asserts
  # that hardware.max_seq_length >= max_prompt_length + max_completion_length.
  max_prompt_length: 1024
  max_completion_length: 32

  # Optimiser
  learning_rate: 0.00005     # 5e-5 — LoRA LR. Was 1e-5, which is a full-finetune LR.
  # KL penalty against the SFT reference (TRL's `beta`). Bracketed from both sides
  # now: 0.04 anchored the policy to a reference that already answers every training
  # prompt optimally (no room to move), but 0.005 under-anchored just as badly. The
  # first full 500-step run logged sustained KL of 1-4 nats with spikes to 7.1, 10.9
  # and 13.3 — at beta=0.005 that is a penalty of at most 0.065, a rounding error
  # against a reward whose entire range is 0.5 wide, so nothing was restraining the
  # policy. It drifted off the SFT reference's clean single-token output into
  # rambling: from ~step 320 completion length climbed until every rollout hit
  # max_completion_length with mean_terminated_length 0.0 (i.e. never emitting EOS).
  kl_coef: 0.02
  lr_scheduler_type: "cosine"
  warmup_steps: 8
  max_grad_norm: 0.3
  temperature: 0.9

  # SFT warm-start
  sft_epochs: 1
  sft_learning_rate: 0.0002  # 2e-4
  sft_batch_size: 2
  sft_gradient_accumulation: 4

  # Checkpoint resumption — save every N steps so Colab disconnects don't lose progress
  save_steps: 50
  save_total_limit: 3

# ===========================================================================
# HARDWARE PROFILE — deferred (backend + device + precision)
# ===========================================================================
# Both training provisions are kept side by side as named profiles. Switch between
# them with the `profile:` selector below, or without editing the file via the
# HARDWARE_PROFILE env var (e.g. `HARDWARE_PROFILE=amd_mi300x python train.py`).
# The backend seam (training/backend.py) dispatches on each profile's `backend`.
#
# TRL constraint when retuning: the global batch
# (per_device_train_batch_size * gradient_accumulation_steps * num_gpus) must be
# divisible by num_generations. max_seq_length must be >= max_prompt_length +
# max_completion_length (asserted in pipeline.py).
#
# READ THE QUOTIENT, NOT JUST THE REMAINDER: global_batch / num_generations is the
# number of distinct PROMPTS behind each optimiser step. At 2*4=8 with 8
# generations that quotient was 1 — every gradient step in the first full run was
# estimated from eight rollouts of a single state, which is about as noisy as GRPO
# gets, and ~31 of the first 250 steps logged reward_std 0.000000 (all eight
# rollouts identical → zero advantage → the step contributed nothing at all).
hardware:
  profile: colab_t4          # active profile: colab_t4 | kaggle_t4 | amd_mi300x | local_rtx3050
  profiles:
    # Google Colab T4 (16 GB VRAM) — Unsloth 4-bit (bitsandbytes). Model choices on T4:
    #   Qwen2.5-3B (current) ~60-75 min GRPO; 1.5B ~45 min but weaker on hard/network;
    #   7B OOMs at 8 generations. global batch 2*4=8, divisible by num_generations 8.
    # gradient_accumulation_steps was 4 (global batch 8 / 8 generations = 1 prompt
    # per optimiser step). At 8 the quotient is 2. This is pure accumulation, so
    # peak VRAM is unchanged, but wall-clock per step roughly doubles: the 500-step
    # run that took 1h42m becomes ~3h25m. If a session budget won't take that, the
    # alternative that keeps the old wall-clock is num_generations 8 → 4 (global
    # batch 8 / 4 = 2 prompts per step, same total rollouts) at the cost of a
    # noisier group-mean baseline. Prefer this one while the budget allows it.
    colab_t4:
      backend: unsloth
      load_in_4bit: true
      max_seq_length: 1280
      num_generations: 8
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 8
    # Kaggle Notebooks — GPU T4 x2 accelerator, 16 GB VRAM (single-GPU use; this
    # codebase doesn't do multi-GPU, so a T4 x2 selection just uses GPU 0). NOT P100:
    # its sm_60 compute capability is below what the pinned PyTorch/Unsloth build ships
    # kernels for, so model load fails with "no kernel image is available for execution
    # on the device" (the notebook's GPU-check cell rejects it up front).
    # Same VRAM class as Colab's T4, so identical batch/seq/generation settings apply
    # -- kept as its own named profile (not an alias) so it can diverge later without
    # touching colab_t4, and so logs/summaries correctly say where it ran.
    kaggle_t4:
      backend: unsloth
      load_in_4bit: true
      max_seq_length: 1280
      num_generations: 8
      # 2 prompts per optimiser step — see the colab_t4 note above for the
      # wall-clock trade and the cheaper num_generations alternative.
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 8
    # AMD Developer Cloud — single MI300X (192 GB HBM3, 20 vCPU, 240 GB RAM) in the
    # rocm/pytorch-training container. Stock transformers + peft + TRL in bf16 (no
    # Unsloth, no bitsandbytes). 192 GB is ~12x a T4, so rollouts and batch scale up.
    # global batch 8*4=32, divisible by num_generations 16.
    amd_mi300x:
      backend: transformers
      load_in_4bit: false      # bf16 — bitsandbytes 4-bit is unreliable on ROCm
      max_seq_length: 1280
      num_generations: 16
      per_device_train_batch_size: 8
      gradient_accumulation_steps: 4
    # Local RTX 3050 laptop GPU (4 GB VRAM) — SMOKE-TEST profile, not a real training
    # target. Unsloth 4-bit works fine here (real CUDA, unlike ROCm). max_seq_length is
    # trimmed to the locked minimum (max_prompt_length + max_completion_length = 1056,
    # rounded up) since 4 GB leaves no headroom; num_generations dropped to GRPO's
    # minimum of 2. Use with GRPO_MAX_STEPS=3 (or similar) to exercise the code path
    # end-to-end, not to actually train — expect this to be slow and possibly still OOM
    # depending on what else is using the GPU. global batch 1*2=2, divisible by
    # num_generations 2.
    local_rtx3050:
      backend: unsloth
      load_in_4bit: true
      max_seq_length: 1088
      num_generations: 2
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 2

output:
  dir: "outputs"
  grpo_dir: "outputs/grpo"
  sft_dir: "outputs/sft"
  reward_log: "outputs/reward_log.csv"
  reward_curve: "outputs/reward_curve.png"
  reward_components: "outputs/reward_components_mean.png"
  model_path: "outputs/trained_sre_agent"

wandb:
  # Set enabled: true and add your W&B API key to Colab secrets as WANDB_API_KEY
  enabled: false
  project: "incident-ops-openenv"
  entity: null        # your W&B username, or leave null for default
  name: null          # run name — auto-generated if null
